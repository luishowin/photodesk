[package]
name = "photodesk-renderer-spike"
description = "Spike C — preview renderer. Does one WGSL source drive both paths? (ARCHITECTURE.md §2.3)"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
naga.workspace = true

[dev-dependencies]
wgpu.workspace = true
half.workspace = true
pollster.workspace = true
bytemuck.workspace = true
# Stage 13's gamut policy is implemented in the render core (§16 #11).
# `encode_stage.rs` checks the shader against the shipped code rather than against a
# second transcription of the same maths, which is the mistake the colour harness's
# own "one workload definition, not two" rule exists to prevent.
photodesk = { path = "../../src-tauri" }
