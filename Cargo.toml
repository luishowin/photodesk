[workspace]
resolver = "3"
members = ["src-tauri", "tests/color", "tests/renderer"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[workspace.dependencies]
half = { version = "2", features = ["bytemuck"] }
lcms2 = "6"
libheif-rs = "2"
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
blake3 = "1"
jpeg-decoder = "0.3"
jpeg-encoder = "0.7"
png = "0.18"
# Already in the tree via `png`; a direct dependency so the iCCP chunk can be
# deflated, which PNG gives no uncompressed alternative to.
flate2 = "1"
# Dev-only. The document schema lives in Rust and the TypeScript types are
# generated from it (§0 register), so this is the derive that does the generating
# — it never reaches a shipped binary, the same arrangement lcms2 has in
# tests/color/.
ts-rs = "12"
